name: Deploy demo to GitHub Pages

on:
    push:
        branches: [main, master]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - run: npm ci

            - name: Build playground demo
              run: npm run build:demo
              env:
                  VITE_BASE_PATH: /tiptap-editor-vue3/

            # GitHub Pages 刷新子路径时需要 404 回退到 index.html
            - name: Add SPA fallback
              run: cp dist-demo/index.html dist-demo/404.html

            - name: Add .nojekyll
              run: touch dist-demo/.nojekyll

            - uses: actions/upload-pages-artifact@v3
              with:
                  path: dist-demo

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
